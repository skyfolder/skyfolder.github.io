      theme: {
        extend: {

    }

    /* Hero pastel sky-blue to light-green gradient */
    .hero-pastel {
      background: linear-gradient(135deg, #e0f2fe 0%, #eef9f2 52%, #ecfccb 100%);
    }

    /* Smooth card entrance animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-card {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Custom subtle border glow on card hover */
    .grant-card {
      border: 1px solid #e2f1f8;
      box-shadow: 0 8px 24px rgba(14, 116, 144, 0.06);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .grant-card:hover {
      transform: translateY(-3px);
      border-color: #7dd3fc;
      box-shadow: 0 14px 30px rgba(2, 132, 199, 0.10), 0 4px 12px rgba(132, 204, 22, 0.08);
    }

  <!-- Application Script -->
  <script>
    // Research Grant Entries
    const GRANTS_DATA = [
      {
        id: 1,
        period: '2023–2026',
        startYear: 2023,
        title: 'AFOLU 산림농지 부문 탄소 기여도 산정을 위한 한국형 식생 탄소-기상 연동 시스템 구축',
        agencyProgram: '한국연구재단 창의도전연구',
        category: '창의도전연구',
        amountDisplay: '2.1억원',
        amountValue: 2.1,
        tags: ['탄소중립', 'AFOLU', '기상모델'],
        isLatest: true
      },
      {
        id: 2,
        period: '2020–2023',
        startYear: 2020,
        title: '딥러닝을 활용한 안개 발생의 시공간적 특성 분석과 가시거리 예측',
        agencyProgram: '한국연구재단 창의도전연구',
        category: '창의도전연구',
        amountDisplay: '1.8억원',
        amountValue: 1.8,
        tags: ['딥러닝', '안개예측', '시공간분석'],
        isLatest: false
      },
      {
        id: 3,
        period: '2017–2020',
        startYear: 2017,
        title: '고해상도 대기 탄소 수치 시뮬레이션 시스템 개발과 동아시아 지역 이산화탄소 복사강제력 평가',
        agencyProgram: '한국연구재단 기본연구',
        category: '기본연구',
        amountDisplay: '1.5억원',
        amountValue: 1.5,
        tags: ['수치시뮬레이션', '대기탄소', '복사강제력'],
        isLatest: false
      },
      {
        id: 4,
        period: '2014–2017',
        startYear: 2014,
        title: '연안 도심 대기 중 미세플라스틱의 발생원 추정 및 대기 경계층 내 이동 특성에 관한 연구',
        agencyProgram: '한국연구재단 중견연구',
        category: '중견연구',
        amountDisplay: null,
        amountValue: 0,
        tags: ['미세플라스틱', '대기경계층', '연안도심'],
        isLatest: false
      },
      {
        id: 5,
        period: '2014–2017',
        startYear: 2014,
        title: '이산화탄소와 기상모델의 접합을 이용한 한반도 식생의 이산화탄소 흡수율 진단',
        agencyProgram: '한국연구재단 기본연구',
        category: '기본연구',
        amountDisplay: '1.5억원',
        amountValue: 1.5,
        tags: ['이산화탄소', '식생흡수율', '기상모델접합'],
        isLatest: false
      }
    ];

    // Pastel Badge Styles per Category
    const CATEGORY_STYLES = {
      '창의도전연구': 'bg-[#e0f2fe] text-[#0369a1] border border-sky-200/80',
      '중견연구': 'bg-[#ccfbf1] text-[#0f766e] border border-teal-200/80',
      '기본연구': 'bg-[#ecfccb] text-[#4d7c0f] border border-lime-200/90'
    };

    // App State
    const state = {
      filter: '전체',
      sort: 'newest',
      view: 'timeline' // 'timeline' | 'grid'
    };

    // DOM Elements
    const filterPillsEl = document.getElementById('filterPills');
    const sortSelectEl = document.getElementById('sortSelect');
    const viewTimelineBtn = document.getElementById('viewTimelineBtn');
    const viewGridBtn = document.getElementById('viewGridBtn');
    const grantsContainerEl = document.getElementById('grantsContainer');

    /**
     * Render Filter Pills with Counts
     */
    function renderFilters() {
      const categories = ['전체', '창의도전연구', '중견연구', '기본연구'];

      filterPillsEl.innerHTML = categories.map((cat) => {
        const count = cat === '전체'
          ? GRANTS_DATA.length
          : GRANTS_DATA.filter((g) => g.category === cat).length;
        const isActive = state.filter === cat;

        const btnClass = isActive
          ? 'bg-[#0284c7] text-white border-[#0284c7] shadow-sm'
          : 'bg-white text-slate-600 border-sky-100 hover:bg-sky-50 hover:border-sky-200 hover:text-sky-800';

        return `
          <button type="button" data-filter="${cat}" aria-pressed="${isActive}"
            class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-semibold border transition-all cursor-pointer ${btnClass}">
            <span>${cat}</span>
            <span class="${isActive ? 'text-sky-100' : 'text-slate-400'} text-xs font-bold">(${count})</span>
          </button>
        `;
      }).join('');

      filterPillsEl.querySelectorAll('button[data-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.filter = btn.getAttribute('data-filter');
          renderFilters();
          renderGrants();
        });
      });
    }

    /**
     * Update Active View Toggle Styling
     */
    function updateViewButtons() {
      const activeClasses = ['bg-white', 'text-[#0284c7]', 'shadow-sm'];
      const inactiveClasses = ['text-slate-500', 'hover:text-[#0f2942]'];

      if (state.view === 'timeline') {
        viewTimelineBtn.classList.add(...activeClasses);
        viewTimelineBtn.classList.remove(...inactiveClasses);
        viewTimelineBtn.setAttribute('aria-pressed', 'true');

        viewGridBtn.classList.remove(...activeClasses);
        viewGridBtn.classList.add(...inactiveClasses);
        viewGridBtn.setAttribute('aria-pressed', 'false');
      } else {
        viewGridBtn.classList.add(...activeClasses);
        viewGridBtn.classList.remove(...inactiveClasses);
        viewGridBtn.setAttribute('aria-pressed', 'true');

        viewTimelineBtn.classList.remove(...activeClasses);
        viewTimelineBtn.classList.add(...inactiveClasses);
        viewTimelineBtn.setAttribute('aria-pressed', 'false');
      }
    }

    /**
     * Filter and Sort Grants
     */
    function getFilteredAndSortedGrants() {
      const filtered = state.filter === '전체'
        ? [...GRANTS_DATA]
        : GRANTS_DATA.filter((g) => g.category === state.filter);

      filtered.sort((a, b) => {
        if (state.sort === 'newest') {
          if (b.startYear !== a.startYear) return b.startYear - a.startYear;
          return a.id - b.id;
        }
        if (state.sort === 'oldest') {
          if (a.startYear !== b.startYear) return a.startYear - b.startYear;
          return a.id - b.id;
        }
        if (state.sort === 'budget') {
          if (b.amountValue !== a.amountValue) return b.amountValue - a.amountValue;
          return b.startYear - a.startYear;
        }
        return 0;
      });

      return filtered;
    }

    /**
     * Build Single Grant Card HTML
     */
    function createGrantCard(grant, index, isGrid) {
      const categoryBadgeClass = CATEGORY_STYLES[grant.category] || 'bg-sky-50 text-sky-700';

      const amountBadgeHTML = grant.amountDisplay
        ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ecfccb] text-[#4d7c0f] border border-lime-300/70 text-xs sm:text-sm font-bold shrink-0">
             <span class="w-1.5 h-1.5 rounded-full bg-[#65a30d]"></span>
             ${grant.amountDisplay}
           </span>`
        : `<span class="inline-flex items-center px-3 py-1 rounded-full bg-slate-100/90 text-slate-500 border border-slate-200/80 text-xs font-medium shrink-0">
             지원금액 비공개
           </span>`;

      const tagsHTML = grant.tags.map((tag) => `
        <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-sky-50/80 text-sky-700/90 border border-sky-100">
          #${tag}
        </span>
      `).join('');

      const topAccentStrip = isGrid
        ? `<div class="h-1.5 w-full bg-gradient-to-r from-[#38bdf8] via-[#7dd3fc] to-[#a3e635]"></div>`
        : '';

      return `
        <article class="animate-card grant-card bg-white rounded-2xl overflow-hidden flex flex-col justify-between" style="animation-delay: ${index * 45}ms">
          ${topAccentStrip}
          <div class="p-5 sm:p-6 flex-1 flex flex-col justify-between">
            <div>
              <!-- Top Metadata Row -->
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
                <div class="flex flex-wrap items-center gap-2">
                  <!-- Period Badge -->
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-50 text-[#0284c7] border border-sky-100 tabular-nums">
                    <svg class="w-3.5 h-3.5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    ${grant.period}
                  </span>

                  <!-- Program Type Pill -->
                  <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold ${categoryBadgeClass}">
                    ${grant.category}
                  </span>
                </div>

                <!-- Amount Pill -->
                ${amountBadgeHTML}
              </div>

              <!-- Research Title -->
              <h2 class="text-base sm:text-lg font-bold text-[#0f2942] leading-snug">
                ${grant.title}
              </h2>

              <!-- Agency / Program -->
              <div class="mt-3 flex items-center gap-2 text-sm text-slate-500">
                <svg class="w-4 h-4 text-sky-500/80 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span class="font-medium text-slate-600">${grant.agencyProgram}</span>
              </div>
            </div>

            <!-- Keyword Tags -->
            <div class="mt-5 pt-4 border-t border-sky-100/70 flex flex-wrap gap-1.5">
              ${tagsHTML}
            </div>
          </div>
        </article>
      `;
    }

    /**
     * Render Grants in Timeline or Card Grid View
     */
    function renderGrants() {
      const grants = getFilteredAndSortedGrants();

      if (grants.length === 0) {
        grantsContainerEl.innerHTML = `
          <div class="text-center py-16 px-4 rounded-2xl bg-white border border-[#e2f1f8] shadow-sky-soft">
            <p class="text-slate-500 text-sm">선택한 조건에 해당하는 연구과제가 없습니다.</p>
          </div>
        `;
        return;
      }

      if (state.view === 'timeline') {
        grantsContainerEl.innerHTML = `
          <div class="relative pl-7 sm:pl-11 space-y-6 before:content-[''] before:absolute before:left-[11px] sm:before:left-[15px] before:top-4 before:bottom-4 before:w-[3px] before:rounded-full before:bg-gradient-to-b before:from-[#38bdf8] before:via-[#7dd3fc] before:to-[#a3e635]">
            ${grants.map((grant, idx) => `
              <div class="relative">
                <!-- Glowing Pastel Timeline Node -->
                <span class="absolute -left-7 sm:-left-11 top-6 flex items-center justify-center w-6 h-6 sm:w-8 sm:h-8 rounded-full ${grant.isLatest ? 'bg-lime-200/70' : 'bg-sky-100/90'} shadow-sm">
                  <span class="w-3 h-3 rounded-full ${grant.isLatest ? 'bg-gradient-to-tr from-[#0284c7] to-[#84cc16] ring-4 ring-lime-200/70' : 'bg-[#38bdf8] ring-4 ring-sky-100'}"></span>
                </span>
                ${createGrantCard(grant, idx, false)}
              </div>
            `).join('')}
          </div>
        `;
      } else {
        grantsContainerEl.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${grants.map((grant, idx) => createGrantCard(grant, idx, true)).join('')}
          </div>
        `;
      }
    }

    // Event Listeners
    sortSelectEl.addEventListener('change', (e) => {
      state.sort = e.target.value;
      renderGrants();
    });

    viewTimelineBtn.addEventListener('click', () => {
      if (state.view !== 'timeline') {
        state.view = 'timeline';
        updateViewButtons();
        renderGrants();
      }
    });

    viewGridBtn.addEventListener('click', () => {
      if (state.view !== 'grid') {
        state.view = 'grid';
        updateViewButtons();
        renderGrants();
      }
    });

    // Initialize
    renderFilters();
    updateViewButtons();
    renderGrants();
  </script>
</body>
</html>
