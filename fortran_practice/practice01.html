<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortran 실습 과제</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; line-height: 1.6; }
    .problem { background: #f8f9fa; border-left: 4px solid #007bff; padding: 15px; margin-bottom: 20px; }
    textarea { width: 100%; height: 180px; font-family: monospace; font-size: 14px; padding: 10px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
    #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    pre { background: #eee; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>

  <h2>Fortran 프로그래밍 실습</h2>

  <div class="problem">
    <h3>과제: "Hello, Fortran!" 출력하기</h3>
    <p>화면에 <code>Hello, Fortran!</code> 문구를 출력하는 Fortran 프로그램을 작성하세요.</p>
  </div>

  <textarea id="code" spellcheck="false">
program hello
  implicit none
  ! 아래에 정답 코드를 작성하세요.
  
end program hello
  </textarea>

  <br><br>
  <button onclick="runCode()">코드 제출 및 채점</button>

  <div id="result"></div>

  <script>
    async function runCode() {
      const codeInput = document.getElementById('code').value;
      const resultDiv = document.getElementById('result');
      
      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.innerHTML = '컴파일 및 실행 중...';

      try {
        // Piston Open API를 통한 gfortran 실행 요청
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: 'fortran',
            version: '10.2.0',
            files: [{ content: codeInput }]
          })
        });

        const data = await response.json();
        
        if (data.run) {
          const userOutput = data.run.stdout.trim();
          const expectedOutput = "Hello, Fortran!";

          if (userOutput === expectedOutput) {
            resultDiv.className = 'success';
            resultDiv.innerHTML = `<strong>정답입니다! 🎉</strong><br>실행 결과: <pre>${userOutput}</pre>`;
          } else {
            resultDiv.className = 'fail';
            resultDiv.innerHTML = `<strong>오답입니다. ❌</strong><br>
              <strong>기대 출력:</strong> <code>${expectedOutput}</code><br>
              <strong>실제 출력:</strong> <pre>${userOutput || '(출력 없음)'}</pre>
              ${data.run.stderr ? `<strong>오류 메시지:</strong> <pre>${data.run.stderr}</pre>` : ''}`;
          }
        } else {
          resultDiv.className = 'fail';
          resultDiv.innerHTML = '실행 중 오류가 발생했습니다.';
        }
      } catch (error) {
        resultDiv.className = 'fail';
        resultDiv.innerHTML = '서버 통신 실패: ' + error.message;
      }
    }
  </script>

</body>
</html>
