<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORTRAN 2장 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF3;
    --bar:#DCE8D6;
    --ink:#1A1D19;
    --muted:#6E7469;
    --blue:#1F4E79;
    --manila:#E3D2A8;
    --red:#A8261C;
    --rule:#C7CCC0;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"IBM Plex Sans KR","IBM Plex Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  code,pre,kbd{font-family:var(--mono)}

  .masthead{
    background:var(--ink);color:var(--paper);
    padding:13px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    border-bottom:3px solid var(--manila);
  }
  .masthead h1{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.3em;margin:0;text-transform:uppercase}
  .masthead .tag{font-size:12.5px;color:#A8AFA2}
  .tally{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:#A8AFA2;display:flex;gap:14px;white-space:nowrap}
  .tally b{color:var(--manila);font-weight:600}

  .banner{background:var(--manila);border-bottom:1px solid #BFAE85;padding:9px 20px;font-family:var(--mono);font-size:12px;color:#5A4E31}

  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1200px;margin:0 auto;min-height:calc(100vh - 58px)}

  .deck{border-right:1px solid var(--rule);padding:0 0 40px}
  .deck-inner{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:18px 0 30px}
  .deck-head{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--blue);
    text-transform:uppercase;padding:14px 16px 6px;display:flex;justify-content:space-between;
    border-top:1px solid var(--rule);margin-top:12px;
  }
  .deck-head:first-child{border-top:0;margin-top:0;padding-top:0}
  .deck-head small{color:var(--muted);letter-spacing:.06em;text-transform:none;font-size:11px}
  .card-item{
    display:flex;gap:9px;align-items:center;width:100%;background:none;border:0;
    border-left:3px solid transparent;padding:5px 16px 5px 13px;text-align:left;cursor:pointer;
    font-family:var(--sans);font-size:13px;color:var(--ink);
  }
  .card-item:hover{background:var(--bar)}
  .card-item[aria-current="true"]{border-left-color:var(--blue);background:var(--bar);font-weight:500}
  .card-item .num{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:18px}
  .card-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
  .dot.ok{background:var(--blue);border-color:var(--blue)}
  .dot.no{background:var(--red);border-color:var(--red)}
  .dot.seen{background:var(--manila);border-color:#BFAE85}

  .sheet{padding:26px 30px 70px;min-width:0}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
  .sheet h2{font-family:var(--mono);font-weight:600;font-size:22px;margin:4px 0 16px;letter-spacing:-.01em}

  .prompt{
    background:repeating-linear-gradient(var(--bar) 0 27px, var(--paper) 27px 54px);
    background-position:0 -13px;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    padding:14px 16px;line-height:27px;
  }
  .prompt code{background:rgba(31,78,121,.10);color:var(--blue);padding:1px 5px;font-size:13.5px}
  .prompt pre{font-size:12.5px;line-height:27px;margin:0;color:var(--blue);overflow-x:auto}

  .editor-wrap{display:flex;margin-top:20px;border:1px solid var(--rule);background:#fff}
  .sprocket{
    width:22px;flex:none;border-right:1px dashed var(--rule);background-color:#F3F2EA;
    background-image:radial-gradient(circle at 11px 11px, var(--paper) 3.2px, transparent 3.4px);
    background-size:22px 22px;background-repeat:repeat-y;
  }
  .sprocket.right{border-right:0;border-left:1px dashed var(--rule)}
  textarea{
    flex:1;min-width:0;border:0;resize:vertical;padding:12px 14px;
    font-family:var(--mono);font-size:13.5px;line-height:1.65;color:var(--ink);background:transparent;tab-size:2;
  }
  textarea:focus{outline:2px solid var(--blue);outline-offset:-2px}
  .oneline textarea{height:46px;resize:none;white-space:pre;overflow-x:auto}

  .choices{margin-top:18px;border:1px solid var(--rule)}
  .choice{
    display:flex;gap:12px;align-items:flex-start;padding:11px 14px;cursor:pointer;
    border-bottom:1px solid var(--rule);background:#fff;font-size:14px;
  }
  .choice:last-child{border-bottom:0}
  .choice:hover{background:var(--bar)}
  .choice input{accent-color:var(--blue);margin:4px 0 0}
  .choice .key{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.1em;margin-top:2px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
  button{font-family:var(--mono);font-size:12.5px;cursor:pointer}
  .btn{background:var(--paper);border:1px solid var(--ink);color:var(--ink);padding:8px 14px;letter-spacing:.05em}
  .btn:hover{background:var(--bar)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-primary:hover{background:var(--blue);border-color:var(--blue)}
  .btn-quiet{border-color:var(--rule);color:var(--muted);background:transparent}
  .btn-quiet:hover{color:var(--ink);border-color:var(--muted)}
  .shortcut{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .verdict{margin-top:22px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .stamp{
    font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.22em;
    padding:9px 16px;border:2.5px solid currentColor;transform:rotate(-2.5deg);flex:none;
  }
  .stamp.ok{color:var(--blue)}
  .stamp.no{color:var(--red)}
  .stamp.seen{color:#8A7647}
  @media (prefers-reduced-motion:no-preference){ .stamp{animation:thud .18s ease-out} }
  @keyframes thud{from{transform:rotate(-2.5deg) scale(1.3);opacity:0}to{transform:rotate(-2.5deg) scale(1);opacity:1}}
  .verdict-body{flex:1;min-width:240px}
  .verdict-body p{margin:0 0 8px}
  .note{border-left:3px solid var(--manila);padding:2px 0 2px 12px;color:#4A4F46;font-size:14px;margin:0}
  .answer-box{
    margin-top:6px;border:1px solid var(--rule);background:#fff;padding:9px 12px;
    font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-x:auto;
  }
  .box-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:13px;display:block}
  .hint{margin-top:14px;background:var(--manila);padding:10px 13px;font-size:14px;border-left:3px solid #BFAE85}

  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--rule)}

  @media (max-width:880px){
    .shell{grid-template-columns:1fr}
    .deck{border-right:0;border-bottom:1px solid var(--rule)}
    .deck-inner{position:static;max-height:none;display:flex;gap:2px;overflow-x:auto;padding:12px 0}
    .deck-head{display:none}
    .card-item{width:auto;flex:none;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
    .card-item[aria-current="true"]{border-left:0;border-bottom-color:var(--blue)}
    .card-item .name{display:none}
    .sheet{padding:22px 18px 60px}
    .masthead h1{letter-spacing:.18em}
    .tally{margin-left:0;width:100%;gap:12px}
  }
</style>
</head>
<body>

<header class="masthead">
  <h1 id="site-title">Fortran 실습</h1>
  <span class="tag" id="site-sub"></span>
  <span class="tally" id="tally"></span>
</header>

<div id="banner" class="banner" hidden></div>

<main class="shell">
  <nav class="deck" aria-label="문제 목록"><div class="deck-inner" id="deck"></div></nav>
  <section class="sheet" id="sheet" aria-live="polite"></section>
</main>

<script src="normalize.js"></script>
<script src="problems.js"></script>
<script src="answer/answers.js"></script>
<script>
(function () {
  'use strict';

  var missing = [];
  if (!window.FQ) missing.push('normalize.js');
  if (!window.PROBLEMS) missing.push('problems.js');
  if (!window.ANSWERS) missing.push('answer/answers.js');
  if (missing.length) {
    var b = document.getElementById('banner');
    b.hidden = false;
    b.textContent = missing.join(', ') + ' 을(를) 불러오지 못했습니다. 세 파일이 index.html 과 같은 위치에 있는지 확인하세요.';
    document.getElementById('sheet').innerHTML =
      '<div class="eyebrow">불러오기 실패</div><h2>파일을 찾을 수 없습니다</h2>' +
      '<div class="prompt">저장소를 통째로 내려받아 index.html 을 열거나, GitHub Pages 주소로 접속하세요. ' +
      'answer 폴더가 index.html 과 같은 위치에 있어야 합니다.</div>';
    return;
  }

  var DATA = window.PROBLEMS;
  var P = DATA.problems;
  var A = window.ANSWERS;

  document.getElementById('site-title').textContent = DATA.title;
  document.getElementById('site-sub').textContent = DATA.subtitle || '';

  var state = P.map(function () {
    return { value: '', choice: null, status: null, hintOpen: false, revealed: false, tries: 0 };
  });
  var cur = 0;

  var deckEl = document.getElementById('deck');
  var sheetEl = document.getElementById('sheet');
  var tallyEl = document.getElementById('tally');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function isCorrect(p, value) {
    var rec = A[p.id];
    if (!rec) return false;
    if (p.type !== 'choice' && !String(value).trim()) return false;
    return rec.h.indexOf(FQ.digest(p.id, p.type, value)) !== -1;
  }

  function renderTally() {
    tallyEl.innerHTML = DATA.sections.map(function (s) {
      var idx = P.map(function (p, i) { return p.section === s.key ? i : -1; }).filter(function (i) { return i >= 0; });
      var ok = idx.filter(function (i) { return state[i].status === 'ok'; }).length;
      return '<span>' + s.label + ' <b>' + ok + '</b>/' + idx.length + '</span>';
    }).join('');
  }

  function renderDeck() {
    var html = '';
    DATA.sections.forEach(function (s) {
      var items = P.map(function (p, i) { return { p: p, i: i }; })
                   .filter(function (x) { return x.p.section === s.key; });
      if (!items.length) return;
      var ok = items.filter(function (x) { return state[x.i].status === 'ok'; }).length;
      html += '<div class="deck-head"><span>' + esc(s.label) + '</span><small>' + ok + '/' + items.length + '</small></div>';
      html += items.map(function (x) {
        return '<button class="card-item" data-go="' + x.i + '" aria-current="' + (x.i === cur) + '">' +
               '<span class="num">' + String(x.p.id).padStart(2, '0') + '</span>' +
               '<span class="name">' + esc(x.p.title) + '</span>' +
               '<span class="dot ' + (state[x.i].status || '') + '"></span></button>';
      }).join('');
    });
    deckEl.innerHTML = html;
    renderTally();
  }

  function renderSheet() {
    var p = P[cur], s = state[cur];
    var isChoice = p.type === 'choice';
    var oneLine = p.type === 'line' || p.type === 'text';
    var sec = DATA.sections.filter(function (x) { return x.key === p.section; })[0] || { label: '' };

    var input;
    if (isChoice) {
      input = '<div class="choices" role="radiogroup" aria-label="보기">' + p.options.map(function (o, i) {
        return '<label class="choice"><input type="radio" name="choice" value="' + i + '"' +
               (s.choice === i ? ' checked' : '') + '>' +
               '<span class="key">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span></label>';
      }).join('') + '</div>';
    } else {
      input = '<div class="editor-wrap' + (oneLine ? ' oneline' : '') + '">' +
              '<div class="sprocket" aria-hidden="true"></div>' +
              '<textarea id="input" spellcheck="false" rows="' + (oneLine ? 1 : 5) + '" placeholder="' +
              (p.type === 'text' ? '답을 입력하세요' : '코드를 입력하세요') + '">' + esc(s.value) + '</textarea>' +
              '<div class="sprocket right" aria-hidden="true"></div></div>';
    }

    var verdict = '';
    if (s.status) {
      var label = s.status === 'ok' ? '정답' : (s.status === 'no' ? '오답' : '해설 확인');
      var body = '';
      if (s.status === 'ok') {
        body = '<p>제출한 답이 정답과 일치합니다.</p>';
      } else if (s.status === 'no') {
        body = '<p>아직 정답과 다릅니다. 시도 ' + s.tries + '회.</p>';
        if (!isChoice) {
          body += '<span class="box-label">채점기가 읽은 내 답</span><div class="answer-box">' +
                  (esc(FQ.normalizeFor(p.type, s.value)) || '(비어 있음)') + '</div>';
        }
      } else {
        body = '<p>해설을 열었습니다. 읽고 나서 직접 다시 입력해 보세요.</p>';
      }
      if ((s.status === 'ok' || s.revealed) && A[p.id] && A[p.id].e) {
        body += '<span class="box-label">해설</span><p class="note">' + esc(FQ.decodeText(A[p.id].e)) + '</p>';
      }
      verdict = '<div class="verdict"><div class="stamp ' + s.status + '">' + label + '</div>' +
                '<div class="verdict-body">' + body + '</div></div>';
    }

    sheetEl.innerHTML =
      '<div class="eyebrow">' + esc(sec.label) + ' · ' + esc(p.topic || '') + ' · ' + String(p.id).padStart(2, '0') + '</div>' +
      '<h2>' + esc(p.title) + '</h2>' +
      '<div class="prompt">' + p.question + '</div>' +
      input +
      '<div class="actions">' +
        '<button class="btn btn-primary" data-act="grade">채점하기</button>' +
        (p.hint ? '<button class="btn" data-act="hint">' + (s.hintOpen ? '힌트 접기' : '힌트 보기') + '</button>' : '') +
        '<button class="btn btn-quiet" data-act="reveal">해설 보기</button>' +
        (!isChoice ? '<button class="btn btn-quiet" data-act="reset">지우기</button>' : '') +
        '<span class="shortcut">Ctrl + Enter</span>' +
      '</div>' +
      (s.hintOpen && p.hint ? '<div class="hint">' + p.hint + '</div>' : '') +
      verdict +
      '<div class="pager">' +
        '<button class="btn" data-act="prev"' + (cur === 0 ? ' disabled' : '') + '>← 이전</button>' +
        '<button class="btn" data-act="next"' + (cur === P.length - 1 ? ' disabled' : '') + '>다음 →</button>' +
      '</div>';

    var ta = document.getElementById('input');
    if (ta) {
      ta.addEventListener('input', function (e) { state[cur].value = e.target.value; });
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          var st = ta.selectionStart, en = ta.selectionEnd;
          ta.value = ta.value.slice(0, st) + '  ' + ta.value.slice(en);
          ta.selectionStart = ta.selectionEnd = st + 2;
          state[cur].value = ta.value;
        }
      });
      ta.focus();
    }
    Array.prototype.forEach.call(sheetEl.querySelectorAll('input[name="choice"]'), function (r) {
      r.addEventListener('change', function (e) { state[cur].choice = Number(e.target.value); });
    });
  }

  function render() { renderDeck(); renderSheet(); }

  function doGrade() {
    var p = P[cur], s = state[cur];
    var val = p.type === 'choice' ? s.choice : s.value;
    if (p.type === 'choice' && s.choice === null) return;
    if (p.type !== 'choice' && !String(val).trim()) return;
    if (isCorrect(p, val)) {
      s.status = 'ok';
    } else {
      s.status = 'no';
      s.tries++;
      if (s.tries >= 2 && p.hint) s.hintOpen = true;   // 두 번 틀리면 힌트를 펼친다
    }
    render();
  }

  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { cur = Number(go.dataset.go); render(); window.scrollTo({ top: 0 }); return; }

    var b = e.target.closest('[data-act]');
    if (!b) return;
    var s = state[cur], p = P[cur];

    switch (b.dataset.act) {
      case 'grade': doGrade(); break;
      case 'hint': s.hintOpen = !s.hintOpen; render(); break;
      case 'reveal':
        s.revealed = true;
        if (s.status !== 'ok') s.status = 'seen';
        render();
        break;
      case 'reset':
        s.value = ''; s.status = null; s.revealed = false; render();
        break;
      case 'prev': if (cur > 0) { cur--; render(); window.scrollTo({ top: 0 }); } break;
      case 'next': if (cur < P.length - 1) { cur++; render(); window.scrollTo({ top: 0 }); } break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doGrade(); }
  });

  render();
})();
</script>
</body>
</html>
