<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortran 2장 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF3; --bar:#DCE8D6; --ink:#1A1D19; --muted:#6E7469;
    --blue:#1F4E79; --manila:#E3D2A8; --red:#A8261C; --rule:#C7CCC0;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"IBM Plex Sans KR","IBM Plex Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  code,pre,kbd{font-family:var(--mono)}

  .masthead{background:var(--ink);color:var(--paper);padding:13px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--manila)}
  .masthead h1{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.3em;margin:0;text-transform:uppercase}
  .masthead .tag{font-size:12.5px;color:#A8AFA2}
  .counter{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--manila);white-space:nowrap}
  .counter b{color:var(--paper);font-weight:600}

  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:calc(100vh - 56px)}

  .deck{border-right:1px solid var(--rule);padding:16px 0 40px;align-self:start;position:sticky;top:0;max-height:100vh;overflow-y:auto}
  .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:baseline}
  .grp:first-child{padding-top:2px}
  .grp em{font-style:normal;color:var(--blue);font-weight:600;letter-spacing:.06em}
  .card-item{display:flex;gap:9px;align-items:center;width:100%;background:none;border:0;border-left:3px solid transparent;padding:5px 16px 5px 15px;text-align:left;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink)}
  .card-item:hover{background:var(--bar)}
  .card-item[aria-current="true"]{border-left-color:var(--blue);background:var(--bar);font-weight:500}
  .card-item .num{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:18px}
  .card-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
  .dot.ok{background:var(--blue);border-color:var(--blue)}
  .dot.no{background:var(--red);border-color:var(--red)}
  .dot.seen{background:var(--manila);border-color:#BFAE85}

  .sheet{padding:24px 30px 70px;min-width:0}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}
  .sheet h2{font-family:var(--mono);font-weight:600;font-size:22px;margin:4px 0 16px}

  .prompt{background:repeating-linear-gradient(var(--bar) 0 27px, var(--paper) 27px 54px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 16px;line-height:27px;background-position:0 -13px}
  .prompt code{background:rgba(31,78,121,.10);color:var(--blue);padding:1px 5px;font-size:13.5px}
  .prompt pre{font-size:13px;line-height:27px;margin:0;color:var(--blue);overflow-x:auto}

  .entry{display:flex;margin-top:18px;border:1px solid var(--rule);background:#fff}
  .sprocket{width:20px;flex:none;background:radial-gradient(circle at 10px 10px, var(--paper) 3px, transparent 3.2px) 0 0/20px 20px repeat-y;background-color:#F3F2EA;border-right:1px dashed var(--rule)}
  .sprocket.right{border-right:0;border-left:1px dashed var(--rule)}
  .entry input{flex:1;min-width:0;border:0;padding:13px 14px;font-family:var(--mono);font-size:14px;color:var(--ink);background:transparent}
  .entry input:focus{outline:2px solid var(--blue);outline-offset:-2px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  button{font-family:var(--mono);font-size:12.5px;cursor:pointer}
  .btn{background:var(--paper);border:1px solid var(--ink);color:var(--ink);padding:8px 14px;letter-spacing:.05em}
  .btn:hover{background:var(--bar)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-primary:hover{background:var(--blue);border-color:var(--blue)}
  .btn-quiet{border-color:var(--rule);color:var(--muted)}
  .btn-quiet:hover{color:var(--ink);border-color:var(--muted)}
  .btn:disabled{opacity:.4;cursor:default}
  .shortcut{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .verdict{margin-top:20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .stamp{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.22em;padding:9px 16px;border:2.5px solid currentColor;transform:rotate(-2.5deg);flex:none}
  .stamp.ok{color:var(--blue)}
  .stamp.no{color:var(--red)}
  .stamp.seen{color:#8A7647}
  @media (prefers-reduced-motion:no-preference){ .stamp{animation:thud .18s ease-out} }
  @keyframes thud{from{transform:rotate(-2.5deg) scale(1.3);opacity:0}to{transform:rotate(-2.5deg) scale(1);opacity:1}}
  .verdict-body{flex:1;min-width:240px}
  .verdict-body p{margin:0 0 8px}
  .note{border-left:3px solid var(--manila);padding:2px 0 2px 12px;color:#4A4F46;font-size:14px}
  .answer-box{margin-top:6px;border:1px solid var(--rule);background:#fff;padding:9px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-x:auto}
  .box-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:12px;display:block}
  .hint{margin-top:12px;background:var(--manila);padding:10px 13px;font-size:14px;border-left:3px solid #BFAE85}

  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:32px;padding-top:16px;border-top:1px solid var(--rule)}
  .banner{background:var(--red);color:#fff;padding:10px 20px;font-family:var(--mono);font-size:12.5px}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    .deck{border-right:0;border-bottom:1px solid var(--rule);position:static;max-height:none;padding:10px 0;display:flex;gap:2px;overflow-x:auto}
    .grp{padding:0 10px 0 16px;align-self:center;white-space:nowrap}
    .card-item{width:auto;flex:none;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
    .card-item[aria-current="true"]{border-left:0;border-bottom-color:var(--blue)}
    .card-item .name{display:none}
    .sheet{padding:20px 16px 60px}
    .counter{margin-left:0;width:100%}
  }
</style>
</head>
<body>

<header class="masthead">
  <h1 id="site-title">Fortran 실습</h1>
  <span class="tag" id="site-sub"></span>
  <span class="counter">맞힌 문제 <b id="score">0</b> / <span id="total">0</span></span>
</header>

<div id="banner" class="banner" hidden></div>

<main class="shell">
  <nav class="deck" id="deck" aria-label="문제 목록"></nav>
  <section class="sheet" id="sheet" aria-live="polite"></section>
</main>

<script src="normalize.js"></script>
<script src="problems.js"></script>
<script src="answer/answers.js"></script>
<script>
/* ── 파일 확인 ───────────────────────────────────────────── */
const missing = [];
if (!window.FQ) missing.push('normalize.js');
if (!window.PROBLEMS) missing.push('problems.js');
if (!window.ANSWERS) missing.push('answer/answers.js');
if (missing.length) {
  const b = document.getElementById('banner');
  b.hidden = false;
  b.textContent = missing.join(', ') + ' 을(를) 찾지 못했습니다. index.html 과 같은 위치에 두었는지 확인하세요.';
}

const DATA = window.PROBLEMS || { title:'Fortran 실습', subtitle:'', groups:[], problems:[] };
const P = DATA.problems;
const GROUPS = DATA.groups && DATA.groups.length ? DATA.groups : [...new Set(P.map(p => p.g))];
document.getElementById('site-title').textContent = DATA.title;
document.getElementById('site-sub').textContent = DATA.subtitle || '';
document.getElementById('total').textContent = P.length;

/* ── 채점: 입력을 정규화해 해시로 대조한다 ─────────────────
   answer/answers.js 에는 해시만 있으므로 정답 원문을 되돌릴 수 없다. */
function isCorrect(p, value) {
  if (!window.ANSWERS || !window.ANSWERS[p.id]) return false;
  if (!String(value).trim()) return false;
  return window.ANSWERS[p.id].h.includes(FQ.answerHash(p.id, p.type, value));
}

/* 모범답안은 '정답 보기'에서만 쓰이며, 눈에 띄지 않게 감싸 둔 것뿐이다. */
function unveil(b64, id) {
  const key = new TextEncoder().encode('ch02#' + id);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ key[i % key.length] ^ ((i * 7 + 11) & 0xff);
  return new TextDecoder().decode(out);
}

/* ── 상태 ────────────────────────────────────────────────── */
const state = P.map(() => ({ value:'', status:null, hintOpen:false, revealed:false }));
let cur = 0;

const deckEl  = document.getElementById('deck');
const sheetEl = document.getElementById('sheet');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderDeck(){
  let html = '';
  for (const g of GROUPS) {
    const items = P.map((p,i) => ({p,i})).filter(x => x.p.g === g);
    const done = items.filter(x => state[x.i].status === 'ok').length;
    html += `<div class="grp"><span>${esc(g)}</span><em>${done}/${items.length}</em></div>`;
    html += items.map(({p,i}) => `
      <button class="card-item" data-go="${i}" aria-current="${i===cur}">
        <span class="num">${String(p.id).padStart(2,'0')}</span>
        <span class="name">${esc(p.t)}</span>
        <span class="dot ${state[i].status||''}"></span>
      </button>`).join('');
  }
  deckEl.innerHTML = html;
  document.getElementById('score').textContent = state.filter(s => s.status === 'ok').length;
  const active = deckEl.querySelector('[aria-current="true"]');
  if (active) active.scrollIntoView({block:'nearest', inline:'nearest'});
}

function renderSheet(){
  if (!P.length) { sheetEl.innerHTML = '<p>문제를 불러오지 못했습니다.</p>'; return; }
  const p = P[cur], s = state[cur];

  let verdict = '';
  if (s.status) {
    const label = s.status === 'ok' ? '정답' : s.status === 'no' ? '오답' : '정답 확인';
    let body = '';
    if (s.status === 'ok')      body = '<p>입력한 답이 정답과 일치합니다.</p>';
    else if (s.status === 'no') body = '<p>아직 정답과 다릅니다. 힌트를 보고 다시 시도하세요.</p>' +
        `<span class="box-label">채점기가 읽은 내 답</span><div class="answer-box">${esc(FQ.normalizeFor(p.type, s.value)) || '(비어 있음)'}</div>`;
    else                        body = '<p>모범 답안입니다. 보지 않고 다시 입력해 보세요.</p>';

    if (s.revealed && window.ANSWERS && window.ANSWERS[p.id]) {
      body += `<span class="box-label">모범 답안</span><div class="answer-box">${esc(unveil(window.ANSWERS[p.id].m, p.id))}</div>`;
    }
    if ((s.status === 'ok' || s.revealed) && p.e) {
      body += `<span class="box-label">해설</span><p class="note">${p.e}</p>`;
    }
    verdict = `<div class="verdict"><div class="stamp ${s.status}">${label}</div><div class="verdict-body">${body}</div></div>`;
  }

  sheetEl.innerHTML = `
    <div class="eyebrow">${esc(p.g)} · ${esc(p.s)} · ${String(p.id).padStart(2,'0')}</div>
    <h2>${esc(p.t)}</h2>
    <div class="prompt">${p.q}</div>
    <div class="entry">
      <div class="sprocket" aria-hidden="true"></div>
      <input id="input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             aria-label="답 입력" placeholder="${p.type === 'line' ? '한 줄로 코드를 입력하세요' : '답을 입력하세요'}"
             value="${esc(s.value).replace(/"/g,'&quot;')}">
      <div class="sprocket right" aria-hidden="true"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" data-act="grade">채점하기</button>
      ${p.h ? `<button class="btn" data-act="hint">${s.hintOpen ? '힌트 접기' : '힌트 보기'}</button>` : ''}
      <button class="btn btn-quiet" data-act="reveal">정답 보기</button>
      <span class="shortcut">Enter</span>
    </div>
    ${s.hintOpen && p.h ? `<div class="hint">${p.h}</div>` : ''}
    ${verdict}
    <div class="pager">
      <button class="btn" data-act="prev" ${cur === 0 ? 'disabled' : ''}>← 이전 문제</button>
      <button class="btn" data-act="next" ${cur === P.length-1 ? 'disabled' : ''}>다음 문제 →</button>
    </div>`;

  const el = document.getElementById('input');
  el.addEventListener('input', e => { state[cur].value = e.target.value; });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doGrade(); } });
  el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
}

const render = () => { renderDeck(); renderSheet(); };

function doGrade(){
  const s = state[cur];
  s.status = isCorrect(P[cur], s.value) ? 'ok' : 'no';
  render();
}

function goTo(i){ cur = i; render(); window.scrollTo({top:0}); }

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { goTo(Number(go.dataset.go)); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const s = state[cur];
  switch (b.dataset.act) {
    case 'grade':  doGrade(); break;
    case 'hint':   s.hintOpen = !s.hintOpen; render(); break;
    case 'reveal': s.revealed = true; if (s.status !== 'ok') s.status = 'seen'; render(); break;
    case 'prev':   if (cur > 0) goTo(cur-1); break;
    case 'next':   if (cur < P.length-1) goTo(cur+1); break;
  }
});

render();
</script>
</body>
</html>
